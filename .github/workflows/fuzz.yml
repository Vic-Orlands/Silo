name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run totp_input -- -max_total_time=60
        working-directory: fuzz
      - run: cargo +nightly fuzz run vault_file -- -max_total_time=60
        working-directory: fuzz
