name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libappindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }} -p silo -p silo-broker -p silo-native-host -p silo-tray
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=".exe"; fi
          staging="dist/staging-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/silo${suffix}" "$staging/"
          cp "target/${{ matrix.target }}/release/silo-broker${suffix}" "$staging/"
          cp "target/${{ matrix.target }}/release/silo-native-host${suffix}" "$staging/"
          cp "target/${{ matrix.target }}/release/silo-tray${suffix}" "$staging/"
          cp -R extension scripts "$staging/"
          cp LICENSE README.md SECURITY.md "$staging/"
          archive="dist/silo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "$staging" .
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$(basename "$archive")" > "$(basename "${archive%.tar.gz}.sha256")")
          else
            (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "${archive%.tar.gz}.sha256")")
          fi
          rm -rf "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: silo-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY"
          for checksum in dist/*.sha256; do
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --output-signature "$checksum.sig" "$checksum"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
