name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p silo -p silo-native-host
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/silo${{ runner.os == 'Windows' && '.exe' || '' }} dist/
          cp target/${{ matrix.target }}/release/silo-native-host${{ runner.os == 'Windows' && '.exe' || '' }} dist/
          tar -czf dist/silo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist silo* 
          shasum -a 256 dist/silo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > dist/silo-${{ github.ref_name }}-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: silo-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY"
          for checksum in dist/*.sha256; do
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --output-signature "$checksum.sig" "$checksum"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
