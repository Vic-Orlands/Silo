[workspace]
members = ["crates/silo-core", "crates/silo-cli", "crates/silo-native-host", "crates/silo-broker", "crates/silo-protocol", "crates/silo-tray"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
argon2 = "0.5"
base64 = "0.22"
base32 = "0.5"
chacha20poly1305 = "0.10"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
rand = "0.8"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
uuid = { version = "1.17", features = ["v4", "serde"] }
prost = "0.14"
png = "0.18"
url = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
tray-icon = "0.24.2"
winit = "0.30"
