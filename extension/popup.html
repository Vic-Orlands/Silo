<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silo</title>
  <style>
    :root { color-scheme: dark; }
    body { width: 220px; margin: 0; padding: 18px; background: #080808; color: #f5f5f5; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 4px; font: 700 18px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
    p { margin: 0 0 18px; color: #929292; line-height: 1.45; }
    button { width: 100%; margin-top: 8px; padding: 10px 12px; border: 0; border-radius: 6px; background: #e9f7ef; color: #0c2416; font-weight: 600; cursor: pointer; }
    button.secondary { background: #1b1b1b; color: #e9f7ef; }
    input { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #292929; border-radius: 6px; background: #111; color: #f5f5f5; }
    #status { min-height: 18px; margin-top: 12px; color: #929292; }
  </style>
</head>
<body>
  <h1>SILO</h1>
  <p>Private vault. Unlock for this session, then choose what to fill.</p>
  <input id="password" type="password" autocomplete="current-password" placeholder="Silo password" aria-label="Silo password">
  <button id="unlock">Unlock Silo</button>
  <button id="login">Fill login</button>
  <button id="otp" class="secondary">Fill one-time code</button>
  <div id="status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
