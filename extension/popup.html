<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silo</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #090909;
      --surface: #111211;
      --surface-raised: #171817;
      --ink: #f3f5f2;
      --muted: #8f9690;
      --faint: #59605b;
      --line: rgba(232, 241, 234, .12);
      --mint: #b8f2cb;
      --mint-ink: #0a1b10;
      --danger: #ff9b82;
    }

    * { box-sizing: border-box; }

    body {
      width: 276px;
      margin: 0;
      padding: 16px;
      background: var(--canvas);
      color: var(--ink);
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .mark {
      color: var(--mint);
      font: 700 16px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    h1 {
      margin: 0;
      font: 700 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
    }

    .eyebrow {
      margin: 4px 0 0;
      color: var(--faint);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .session {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .session::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--faint);
      content: "";
    }

    main { padding-top: 15px; }

    .intro {
      margin: 0 0 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .search span {
      color: var(--faint);
      font: italic 10px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .search input::placeholder { color: var(--faint); }

    .section-label {
      margin: 0 0 6px;
      color: var(--faint);
      font: italic 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    button {
      height: 30px;
      padding: 0 11px;
      border: 0;
      border-radius: 5px;
      background: var(--mint);
      color: var(--mint-ink);
      font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    button:hover { background: #d2f8dc; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
    button:disabled { cursor: wait; opacity: .55; }

    .actions {
      display: grid;
      gap: 6px;
      margin-top: 14px;
    }

    .action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 10px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
    }

    .action:hover { background: var(--surface-raised); }

    .action span:last-child {
      color: var(--faint);
      font: italic 10px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .action.secondary { color: var(--mint); }

    .action.tertiary { color: var(--muted); }

    .session-action {
      width: 100%;
      margin-top: 2px;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }

    .session-action:hover { background: var(--surface); color: var(--ink); }

    #matches {
      display: grid;
      gap: 4px;
      margin-top: 9px;
    }

    .match {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 27px;
      padding: 0 8px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      text-align: left;
    }

    .match:hover, .match.selected { background: var(--surface); color: var(--ink); }

    .match small {
      max-width: 125px;
      overflow: hidden;
      color: var(--faint);
      font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #status {
      min-height: 17px;
      margin: 12px 1px 0;
      color: var(--muted);
      font-size: 11px;
    }

    #status.success { color: var(--mint); }
    #status.error { color: var(--danger); }

    .approval, .candidate {
      margin-top: 10px;
      padding: 10px;
      background: var(--surface);
    }

    .approval p, .candidate p { margin: 0 0 9px; color: var(--muted); }

    .approval-actions, .candidate-actions {
      display: flex;
      gap: 6px;
    }

    .approval-actions button, .candidate-actions button { flex: 1; }

    .approval-actions button:last-child, .candidate-actions button:last-child {
      background: transparent;
      color: var(--muted);
    }

    footer {
      margin-top: 13px;
      color: var(--faint);
      font: italic 10px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark">▌</span>
      <div>
        <h1>SILO</h1>
        <p class="eyebrow">private browser bridge</p>
      </div>
    </div>
    <span class="session">local</span>
  </header>

  <main>
    <p id="site" class="intro">Silo stays local. Choose exactly what to fill.</p>
    <label class="search" for="search">
      <span>/</span>
      <input id="search" type="search" autocomplete="off" placeholder="Search logins" aria-label="Search matching logins">
    </label>
    <p class="section-label">// session access</p>
    <button id="refresh" class="session-action">Check Silo session ↗</button>
    <div id="matches" aria-label="Matching logins"></div>

    <div id="candidate" class="candidate" hidden>
      <p id="candidate-copy">Save this login to Silo?</p>
      <div class="candidate-actions">
        <button id="save-login">Save login</button>
        <button id="dismiss-candidate">Dismiss</button>
      </div>
    </div>

    <div id="approval" class="approval" hidden>
      <p id="approval-copy">Approve this action?</p>
      <div class="approval-actions">
        <button id="approve">Approve</button>
        <button id="cancel-approval">Cancel</button>
      </div>
    </div>

    <div class="actions" aria-label="Fill actions">
      <button id="login" class="action"><span>Fill login</span><span>username + password</span></button>
      <button id="username" class="action"><span>Fill username</span><span>username only</span></button>
      <button id="password" class="action"><span>Fill password</span><span>password only</span></button>
      <button id="otp" class="action secondary"><span>Fill one-time code</span><span>TOTP</span></button>
    <button id="open-silo" class="action tertiary"><span>Unlock Silo</span><span>desktop</span></button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <footer>nothing is filled automatically · no password stored here</footer>
  <script src="popup.js"></script>
</body>
</html>
